name: Bug report
description: Report a reproducible defect in FlipbookEngine
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal reproduction or repository link.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FlipbookEngine version
      placeholder: 0.3.0
  - type: input
    id: environment
    attributes:
      label: Browser and OS