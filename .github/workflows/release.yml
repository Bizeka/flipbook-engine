name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r .version package.json)"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify before publish
        run: npm run typecheck && npm test && npm run build && npm run pack:check
      - name: Publish with provenance
        run: npm publish --provenance --access public
